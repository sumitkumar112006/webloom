<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webloom — Digital Growth, Technology & Creative Studio</title>
    <meta name="description" content="Webloom combines technology, creative design, AI automation and digital marketing to help ambitious businesses build, grow and scale online." />
    <link rel="icon" type="image/png" href="/assets/Profile.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#0B1120" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('webloom-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F6F8FC] dark:bg-[#0B1120] text-[#111827] dark:text-[#F3F4F6] antialiased selection:bg-[#23469F] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
