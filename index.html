<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webloom — Human-Crafted Digital Studio & 3D Engineering</title>
    <meta name="description" content="Webloom is a human-crafted digital studio building modern web architectures, visual interfaces, and 3D precision engineering." />
    <link rel="icon" type="image/png" href="/assets/logo_emblem.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      (function() {
        try {
          // Reset dark mode to guarantee pristine light/glass mode with yellow & white theme
          localStorage.setItem('webloom-theme', 'light');
          document.documentElement.classList.remove('dark');
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-white text-[#111827] antialiased selection:bg-[#FDE047] selection:text-[#111827]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
